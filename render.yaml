
services:
  - type: worker
    name: sedoo-verified-qr
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: FAYDA_API_KEY
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: PAYMENT_INSTRUCTIONS
        sync: false
      - key: DB_PATH
        value: /var/data/sedoo_verified_qr.db
        
